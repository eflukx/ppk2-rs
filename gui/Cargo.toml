[package]
name = "ppk2-gui"
version = "0.2.0"
edition = "2021"
description = "Native GUI for Nordic's Power Profiler Kit 2"
license = "MIT"
publish = false

[dependencies]
ppk2 = { path = "..", default-features = false }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_plot = "0.38.0"
tracing = "0.1.41"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ppk2 = { path = "..", features = ["serialport"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = "4.7.2"
tracing-subscriber = "0.3.19"

# The web version: WebSerial needs `RUSTFLAGS=--cfg=web_sys_unstable_apis`, see .cargo/config.toml
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "HtmlCanvasElement",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Serial",
    "SerialInputSignals",
    "SerialOptions",
    "SerialOutputSignals",
    "SerialPort",
    "SerialPortFilter",
    "SerialPortInfo",
    "SerialPortRequestOptions",
    "Window",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "console",
] }
