[package]
name = "ppk2"
version = "0.2.0"
edition = "2021"
authors = ["Henk Oordt <hd@oordt.dev>", "Rogier Lodewijks <rogier@lodewijks.org>"]
description = "A driver for Nordic's Power Profiler Kit 2"
readme = "README.md"
repository = "https://github.com/eflukx/ppk2-rs"
license = "MIT"
keywords = ["PPK2", "Power", "Profiler", "Nordic", "Serial"]
categories = ["embedded", "development-tools::profiling"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num_enum = "0.7.3"
serialport = { version = "4.7.2", features = ["usbportinfo-interface"], optional = true }
thiserror = "2.0.12"
tracing = "0.1.41"

[features]
default = ["serialport"]
# The blocking serial port driver ([Ppk2]). Without it only the protocol is available: the commands, metadata and
# sample decoding, e.g. to talk to the PPK2 over WebSerial in the browser.
serialport = ["dep:serialport"]

[dev-dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
ctrlc = "3.4.7"
tracing-subscriber = "0.3.19"
clap = { version = "4.5.40", features = ["derive", "env"] }

[[example]]
name = "cli"
required-features = ["serialport"]

[badges]
maintenance = { status = "passively-maintained" }

[workspace]
members = ["gui"]

# Optimized release build: `cargo build --profile release-lto -p ppk2-gui`, into target/release-lto.
# Smaller and slightly faster than `release`, but slower to build.
[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
# Debug symbols out of the binary on Linux and macOS (on Windows they're in a separate .pdb anyway)
strip = true
